    <path d="M 1028 654 L 1054 626 L 1080 666 L 1106 596 L 1132 632 L 1158 560 L 1184 610 L 1210 520 L 1236 584 L 1262 488" stroke="#e25cff" stroke-width="1.5" opacity="0.58" filter="url(#fuchsia-glow)"/>
    <circle cx="1210" cy="520" r="4.2" fill="#0a0a0c" stroke="#e25cff" stroke-width="1.3"/>
    <circle cx="1262" cy="488" r="4.2" fill="#0a0a0c" stroke="#ffffff" stroke-width="1.1" opacity="0.9"/>
