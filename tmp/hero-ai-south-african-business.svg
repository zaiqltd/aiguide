<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI and South African business constellation hero</title>
  <desc id="desc">Dark editorial vector illustration with luminous violet network nodes, South Africa outline, and a rising signal.</desc>
  <defs>
    <radialGradient id="violet-aura" cx="68%" cy="48%" r="48%">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.23"/>
      <stop offset="0.34" stop-color="#8b5cff" stop-opacity="0.08"/>
      <stop offset="0.72" stop-color="#8b5cff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsia-aura" cx="78%" cy="32%" r="28%">
      <stop offset="0" stop-color="#e25cff" stop-opacity="0.16"/>
      <stop offset="0.46" stop-color="#e25cff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="74%">
      <stop offset="0" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#0a0a0c" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.68"/>
    </radialGradient>
    <linearGradient id="rising-gradient" x1="575" y1="698" x2="1338" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#8b5cff"/>
      <stop offset="0.72" stop-color="#e25cff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sa-outline-gradient" x1="610" y1="604" x2="1125" y2="668" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#8b5cff" stop-opacity="0.52"/>
      <stop offset="0.75" stop-color="#e25cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#ffffff" opacity="0.28"/>
    </pattern>
    <mask id="grid-fade">
      <rect width="1600" height="900" fill="black"/>
      <radialGradient id="grid-mask-gradient" cx="63%" cy="49%" r="66%">
        <stop offset="0" stop-color="white" stop-opacity="0.92"/>
        <stop offset="0.52" stop-color="white" stop-opacity="0.52"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <rect width="1600" height="900" fill="url(#grid-mask-gradient)"/>
    </mask>
    <filter id="soft-violet-glow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.545 0 0 0 0 0.361 0 0 0 0 1 0 0 0 0.72 0" result="violet"/>
      <feMerge>
        <feMergeNode in="violet"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tight-violet-glow" x="-90%" y="-90%" width="280%" height="280%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.545 0 0 0 0 0.361 0 0 0 0 1 0 0 0 0.85 0" result="violet"/>
      <feMerge>
        <feMergeNode in="violet"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fuchsia-glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.886 0 0 0 0 0.361 0 0 0 0 1 0 0 0 0.7 0" result="fuchsia"/>
      <feMerge>
        <feMergeNode in="fuchsia"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="deep-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1600" height="900" fill="#0a0a0c"/>
    <rect width="1600" height="900" fill="url(#violet-aura)"/>
    <rect width="1600" height="900" fill="url(#fuchsia-aura)"/>
    <ellipse cx="1040" cy="493" rx="520" ry="260" fill="#8b5cff" opacity="0.048" filter="url(#deep-blur)"/>
    <ellipse cx="1278" cy="278" rx="270" ry="160" fill="#e25cff" opacity="0.045" filter="url(#deep-blur)"/>
    <rect width="1600" height="900" fill="url(#vignette)"/>
  </g>

  <g id="faint-dot-grid" mask="url(#grid-fade)">
    <rect x="286" y="84" width="1194" height="704" fill="url(#dot-grid)" opacity="0.22"/>
    <path d="M 480 158 H 1435 M 480 742 H 1435 M 526 120 V 788 M 1392 120 V 788" stroke="#ffffff" stroke-width="1" opacity="0.025"/>
  </g>

  <g id="editorial-framing" fill="none" stroke="#ffffff" stroke-width="1">
