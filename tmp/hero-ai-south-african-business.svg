  <g id="micro-circuitry" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1184 606 H 1336 M 1220 642 H 1372 M 1288 570 H 1400" stroke="#ffffff" stroke-width="0.8" opacity="0.08"/>
    <path d="M 1336 606 V 582 H 1380 M 1372 642 V 666 H 1416 M 1288 570 V 546 H 1330" stroke="#8b5cff" stroke-width="0.9" opacity="0.22" filter="url(#tight-violet-glow)"/>
