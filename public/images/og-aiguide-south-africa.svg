<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Guide social share image</title>
  <desc id="desc">Editorial social share card for AI Guide, straight answers about AI for South African business, by Zaiq.</desc>
  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#16130F" opacity="0.13"/>
    </pattern>
    <linearGradient id="bone-vignette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE9DD"/>
      <stop offset="0.62" stop-color="#EFE9DD"/>
      <stop offset="1" stop-color="#E7DDCC"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1200" height="630" fill="#EFE9DD"/>
    <rect width="1200" height="630" fill="url(#bone-vignette)" opacity="0.85"/>
  </g>

  <g id="dot-grid" opacity="0.55">
    <rect x="72" y="68" width="1056" height="486" fill="url(#dot-grid)"/>
  </g>

  <g id="editorial-field" fill="none">
    <rect x="48" y="42" width="1104" height="546" rx="0" stroke="#16130F" stroke-width="1.25" opacity="0.72"/>
    <rect x="71" y="66" width="1058" height="498" rx="0" stroke="#5A1A1E" stroke-width="0.75" opacity="0.28"/>
    <line x1="96" y1="509" x2="1104" y2="509" stroke="#16130F" stroke-width="1" opacity="0.22"/>
  </g>

  <g id="accent-marks" fill="none">
    <path d="M96 118 H250" stroke="#5A1A1E" stroke-width="7" stroke-linecap="square"/>
    <path d="M96 133 H178" stroke="#FF4A12" stroke-width="7" stroke-linecap="square"/>
    <path d="M947 482 H1104" stroke="#5A1A1E" stroke-width="7" stroke-linecap="square"/>
    <path d="M1030 466 H1104" stroke="#FF4A12" stroke-width="7" stroke-linecap="square"/>
  </g>

  <g id="typography" fill="#16130F" font-family="Georgia, 'Times New Roman', serif" text-rendering="geometricPrecision">
    <text x="92" y="322" font-size="151" font-weight="700" letter-spacing="-1">AI Guide</text>
    <circle cx="763" cy="201" r="12" fill="#FF4A12"/>
    <text x="98" y="397" font-size="36" font-weight="400" letter-spacing="0" fill="#5A1A1E">Straight answers about AI for South African business</text>
  </g>

  <g id="footer" fill="#16130F" font-family="Georgia, 'Times New Roman', serif" text-rendering="geometricPrecision">
    <text x="98" y="545" font-size="23" font-weight="400" letter-spacing="0.8" opacity="0.74">by Zaiq</text>
    <circle cx="1085" cy="538" r="4" fill="#FF4A12"/>
    <circle cx="1104" cy="538" r="4" fill="#5A1A1E"/>
  </g>
</svg>
